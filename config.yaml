# (house_1_w0, senate_15_w1, house_29_w25), but house_1_w0 and senate_15_w1
# fail the >=60% hand-landmark gate (57.8% / 53.4% left hand, measured
# directly against their .pose confidence data -- not a code bug, see
# reports/phase1_review.md). Swapped in the two next-shortest videos that
# pass, keeping the same 2-house/1-senate signer mix.
# To run everything, pass --all or extend this list.
